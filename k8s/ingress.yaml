# Makes the shop open on the plain server IP: http://<server-public-ip>
# k3s ships with the Traefik router listening on port 80; this rule sends all traffic to the shopsphere Service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopsphere
  namespace: shopsphere
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shopsphere
                port:
                  number: 80
