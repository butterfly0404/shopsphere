# MongoDB database: 1 pod, data kept on a persistent volume so it survives restarts and redeploys.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  namespace: shopsphere
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: shopsphere
  labels: { app: mongo }
spec:
  replicas: 1
  strategy: { type: Recreate }   # never run two MongoDB pods on the same volume
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongo-data
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: shopsphere
spec:
  type: ClusterIP          # only reachable from inside the cluster
  selector: { app: mongo }
  ports:
    - port: 27017
      targetPort: 27017
