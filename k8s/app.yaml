# ShopSphere app: 2 pods behind a NodePort service.
# Jenkins replaces IMAGE_PLACEHOLDER with the image it just built, e.g. youruser/shopsphere:v12
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopsphere
  namespace: shopsphere
  labels: { app: shopsphere }
spec:
  replicas: 2
  revisionHistoryLimit: 5           # keeps old versions for "kubectl rollout undo"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0             # zero downtime: old pods stay until new ones are ready
      maxSurge: 1
  selector:
    matchLabels: { app: shopsphere }
  template:
    metadata:
      labels: { app: shopsphere }
    spec:
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: shopsphere-secrets
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:               # traffic only when the app AND database are ready
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:                # restart the pod if the process hangs
            httpGet: { path: /api/live, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: shopsphere
  namespace: shopsphere
spec:
  type: NodePort
  selector: { app: shopsphere }
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080               # backup address http://<ip>:30080 (main address is http://<ip> via k8s/ingress.yaml)
